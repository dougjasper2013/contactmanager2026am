<div class="container">

    <div class="toolbar">
        <h2>Update Contact</h2>
    </div>

    <form #f="ngForm" (ngSubmit)="updateContact(f)">

        <div class="form-group">
            <label>First Name</label>
            <input type="text" name="firstName" class="form-control"[(ngModel)]="contact.firstName" required max-length="50" />
        </div>

        <div class="form-group">
            <label>Last Name</label>
            <input type="text" name="lastName" class="form-control"[(ngModel)]="contact.lastName" required max-length="50" />
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="text" name="emailAddress" class="form-control"[(ngModel)]="contact.emailAddress" required max-length="250" />
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phoneNumber" class="form-control"[(ngModel)]="contact.phoneNumber" required max-length="50" />
        </div>

        <div class="form-group">
            <label>Birth Date</label>
            <input type="date" name="dob" class="form-control"[(ngModel)]="contact.dob" required [max]="maxDate" />
        </div>

        <!-- Buttons -->
         <div class="form-group">
            <button type="submit" class="btn btn-primary" [disabled]="f.invalid">Update</button>
            <button class="btn btn-secondary" routerLink="/contacts">Cancel</button>
         </div>

    </form>
</div>
