<div id="thelist" class="contact-list-container">
    <div class="toolbar">
        <h2>Contact List</h2>
    </div>

    @for (contact of contacts; track contact.contactID) {
        <div class="contact-card row align-items-center">
            <div class="col-2 contact-field">{{ contact.firstName }}</div>
            <div class="col-2 contact-field">{{ contact.lastName }}</div>
            <div class="col-2 contact-field">{{ contact.emailAddress }}</div>
            <div class="col-2 contact-field">{{ contact.phoneNumber }}</div>
            <div class="col-2 contact-field">{{ contact.dob }}</div>            
        </div> 
    }
    
</div>

<div id="links" class="mt-4 text-center">
    <button class="btn btn-sm btn-primary me-2 " routerLink="/add">Add Contact</button>
</div>
