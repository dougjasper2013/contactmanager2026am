<div class="container">

    <div class="toolbar">
        <h2>Contact List</h2>
    </div>

    <form #f="ngForm" (ngSubmit)="addContact(f)">
        <!-- First Name -->
         <div class="form-group">
            <label>First Name</label>
            <input type="text" name="firstName" class="form-control" [(ngModel)]="contact.firstName" 
                required maxlength="50" #firstName="ngModel" />
         </div>

         <!-- Last Name -->
         <div class="form-group">
            <label>Last Name</label>
            <input type="text" name="lastName" class="form-control" [(ngModel)]="contact.lastName" 
                required maxlength="50" #lastName="ngModel" />
         </div>

         <!-- Email Address -->
         <div class="form-group">
            <label>Email Address</label>
            <input type="text" name="emailAddress" class="form-control" [(ngModel)]="contact.emailAddress" 
                required maxlength="50" #emailAddress="ngModel" />
         </div>

         <!-- Phone Number -->
         <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phoneNumber" class="form-control" [(ngModel)]="contact.phoneNumber" 
                required maxlength="50" #phoneNumber="ngModel" />
         </div>

         <!-- DOB -->
         <div class="form-group">
            <label>Date Of Birth</label>
            <input type="date" name="dob" class="form-control" [(ngModel)]="contact.dob" 
                required maxlength="50" #dob="ngModel" />
         </div>

         <!-- Upload Image -->
         <div class="form-group">
            <label>Upload Image</label>
            <input type="file" name="imageName" class="form-control" (change)="onFileSelected($event)" />
         </div>

         <!-- Buttons -->
         <div class="form-group">
            <button type="submit" class="btn btn-primary" [disabled]="f.invalid">Add Contact</button>
            <button class="btn btn-secondary" routerLink="/contacts">Cancel</button>
         </div>

    </form>
</div>
